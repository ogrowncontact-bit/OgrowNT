# Risk Engine configuration — see docs/blueprint/08-risk-engine.md
# Editable here directly, or via PATCH /api/system/risk-limits (admin only).
# NOTE: a PATCH rewrites this whole file and does not preserve comments —
# re-add them by hand if you edit through the API and want them back.
capital:
  initial_paper_capital: 10000
per_trade:
  max_risk_pct: 1.0
  min_risk_reward: 1.5
portfolio:
  max_exposure_pct: 60
  max_single_asset_pct: 15
  max_correlated_cluster_pct: 25
  correlation_threshold: 0.7
  # "PROMPT 8" §14: cap on how much of equity one strategy may have open
  # across ALL its positions/assets at once — enforced by the Portfolio
  # Manager (packages/portfolio/manager.py), a step after Risk Engine
  # approval, not by the Risk Engine itself (see that module's docstring
  # for why this is a genuinely separate check from max_single_asset_pct).
  max_strategy_allocation_pct: 30
loss_limits:
  max_daily_loss_pct: 3
  max_weekly_loss_pct: 6
  max_monthly_loss_pct: 10
  max_strategy_drawdown_pct: 10
  max_portfolio_drawdown_pct: 15
liquidity:
  max_spread_bps: 50
  min_orderbook_depth_multiple: 3
data_quality:
  max_staleness_seconds: 120
# Risk-per-trade multiplier applied at each Safety Belt state — Prompt 4
# §35 requires this be configurable, not hardcoded in Python.
safety_belt_multipliers:
  normal: 1.0
  caution: 0.75
  defensive: 0.5
  emergency: 0.0
  kill_switch: 0.0
# Risk-per-trade multiplier applied at each News Risk Guard level
# (packages/risk/news_guard.py) — Prompt 6 §17/§26.
news_risk_multipliers:
  normal: 1.0
  elevated: 0.75
  high: 0.5
  critical: 0.0
# "PROMPT 8" §41: no leverage this phase — every position is sized out of
# real (paper) equity, never borrowed capital. Kept as an explicit,
# operator-visible number (not just an implicit consequence of the sizing
# caps above) so a future LIVE phase has one obvious place to raise it,
# and packages/risk/engine.py can assert it's exactly 1.0 while paper-only.
leverage:
  max_leverage: 1.0
# "PROMPT 8" §37-39: consecutive-loss count (across the whole portfolio,
# not one strategy) at which packages/risk/loss_streak.py halves new
# position size — capital preservation without a full trading halt, which
# the safety belts already own at a worse drawdown level.
loss_streak:
  threshold: 5
  size_multiplier_when_triggered: 0.5
# "PROMPT 8" §28-30: what an OPEN position does when a regime shift, a
# critical news event, or a portfolio emergency (Kill Switch / max
# drawdown) hits while it's still open. Each is hold|reduce|close — an
# explicit operator choice (packages/risk/position_policy.py), never
# implicit behavior decided ad hoc by whichever module noticed the trigger
# (§30: "Não implementar comportamento implícito").
position_risk_policy:
  regime_change: close
  news_risk: reduce
  portfolio_emergency: close
  reduce_fraction: 0.5
