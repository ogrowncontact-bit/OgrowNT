[project]
name = "ogrownt"
version = "0.1.0"
description = "OgrowNT — private AI quant research & paper trading system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    # passlib 1.7.4's bcrypt backend probes are incompatible with bcrypt>=4.1
    # (AttributeError on __about__, ValueError on the wrap-bug self-test).
    "bcrypt>=4.0,<4.1",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "anthropic>=0.40",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.16",
    "mypy>=1.13",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle+pyflakes (real bugs — unused imports/vars, undefined
# names, etc.). I: import sorting. UP: modernize syntax for the pinned
# Python floor. B: flake8-bugbear common-bug patterns. Deliberately not
# enabling stricter style-only rule sets (line length is already relaxed
# above) — this is meant to catch real mistakes, not reformat the codebase.
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # timezone.utc is used consistently across the whole codebase and is
    # just as correct as datetime.UTC — not worth a wall-to-wall rename.
    "UP017",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's own documented pattern: `db: Session = Depends(get_session)`.
# Depends()/Query()/etc are markers evaluated once at route registration,
# not per-request mutable defaults — the exact footgun B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header", "fastapi.Cookie"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
