name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ogrownt
          POSTGRES_PASSWORD: ogrownt
          POSTGRES_DB: ogrownt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ogrownt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ogrownt:ogrownt@localhost:5432/ogrownt
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-only-not-a-real-secret
      JWT_SECRET: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy packages apps scripts
      - run: alembic upgrade head
      - run: pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Confirms all three images actually build (including the non-root USER
  # steps) — the project's own dev sandbox has no Docker daemon, so this is
  # the only place that verifies infra/docker/Dockerfile.* before a real
  # `docker compose up`. Plain `docker build` (ubuntu-latest runners ship
  # Docker preinstalled) rather than a build action, so the exact
  # -f/context semantics match what a developer would run by hand.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/docker/Dockerfile.api .
      - run: docker build -f infra/docker/Dockerfile.worker .
      - run: docker build -f infra/docker/Dockerfile.dashboard apps/dashboard
