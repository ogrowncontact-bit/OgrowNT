name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Dummy credentials, only ever used against the ephemeral CI Postgres
  # service below — never a real database.
  DATABASE_URL: postgresql://inner_ci:inner_ci@localhost:5432/inner_ci?schema=public
  SESSION_SECRET: ci-dummy-secret
  ENCRYPTION_KEY: ci-dummy-secret

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: inner_ci
          POSTGRES_PASSWORD: inner_ci
          POSTGRES_DB: inner_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Applies every migration.sql in packages/db/prisma/migrations against a
      # fresh database, the same way a real deployment would — catches a
      # broken migration file (several here were hand-written rather than
      # generated by `prisma migrate dev`, which needs a TTY this pipeline
      # doesn't have either) before it ever reaches a real environment.
      - name: Apply migrations to a fresh database
        run: pnpm db:migrate:deploy

      - name: Seed the freshly migrated database
        run: pnpm db:seed

      - name: Build
        run: pnpm build
