[alembic]
script_location = infra/migrations
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url is intentionally omitted here — infra/migrations/env.py reads
# DATABASE_URL from packages.shared.settings so dev/test/prod all resolve the
# same way as the application does.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
